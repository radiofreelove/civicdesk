- id: MED-S27
  desk: medicaid
  jurisdiction: US
  title: Medicaid Program; Community Engagement Requirement for Certain Individuals (interim final rule), 91 Fed.
    Reg. 33348
  short: Federal rule on the work requirement (91 Fed. Reg. 33348)
  publisher: Centers for Medicare & Medicaid Services
  url: https://www.federalregister.gov/documents/2026/06/03/2026-11094/medicaid-program-community-engagement-requirement-for-certain-individuals
  format: Web page
  kind: federal-rule
  document_date: Published June 3, 2026; effective July 31, 2026
  checked: '2026-11-22'
  status: official
  official: true
  verified_by: human_reviewed_machine_assisted
  read_depth: partial
  read_by: human_machine_hybrid
  public_note: Read preamble sections I to II.C.8 and full regulatory text of 42 C.F.R. 435.550 to 435.557 (91 Fed.
    Reg. 33348, at 33469-33475; re-checked Nov. 22, 2026). 42 C.F.R. 435.552(f)(1)-(2) and (g)(1)-(2) set the $580
    income test ($7.25 federal minimum wage times 80 hours, and 6-month average for seasonal workers) using MAGI-based
    household income under 42 C.F.R. 435.603. 42 C.F.R. 435.554(c)(5) defines medically frail (including the 5-year
    stable-recovery carve-out for substance use disorder). Also covers half-time school (including high school and
    GED), work and community service definitions, exclusions, hardships, and the 30-day cure period.
