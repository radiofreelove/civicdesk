- id: MED-U39
  desk: medicaid
  jurisdiction: UT
  title: 'Utah Code Section 26B-3-142.1: Medicaid work requirements (enacted by 2026 H.B. 471, ch. 342)'
  short: Utah Code 26B-3-142.1 (2026 H.B. 471)
  publisher: Utah State Legislature
  url: https://le.utah.gov/xcode/Title26B/Chapter3/C26B-3-S142.1_2026050620270101.pdf
  format: PDF
  kind: state-rule
  document_date: Effective Jan. 1, 2027
  checked: '2026-11-21'
  status: official
  official: true
  verified_by: human_reviewed_machine_assisted
  read_depth: full
  read_by: human_machine_hybrid
  public_note: Read in full on 2026-11-21 (2 pages). Enacted by 2026 H.B. 471 (Laws of Utah 2026, ch. 342), effective
    Jan. 1, 2027. Subsection (3)(b) requires the department to use documentary evidence including claims data and
    bars relying exclusively on self-attestation. Subsection (4)(a)-(b) requires applicants seeking an exemption
    to provide documentation unless the department can confirm it from other reliable sources, and requires the
    department to verify all exemptions (barring managed care organization exemption approvals, though MCO data
    may be accepted). Subsection (4)(c) provides that for medically frail or special needs conditions where electronic
    data is insufficient, the department may provisionally approve the exemption from a diagnosis identified by
    the individual and must verify it using electronic data or a statement from a health care professional.
