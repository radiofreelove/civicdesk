- id: MED-S41
  desk: medicaid
  jurisdiction: US
  title: SMD# 26-006, Optional Hold Harmless Period for Community Engagement Implementation (State Medicaid Director
    letter)
  short: Federal letter to state Medicaid directors, Nov. 13, 2026 (SMD# 26-006)
  publisher: Centers for Medicare & Medicaid Services
  url: https://www.medicaid.gov/Federal-Policy-Guidance/Downloads/smd26006.pdf
  format: PDF
  kind: federal-letter
  document_date: Nov. 13, 2026
  checked: '2026-11-24'
  status: official
  official: true
  verified_by: human_reviewed_machine_assisted
  read_depth: full
  read_by: human_machine_hybrid
  public_note: 'Read in full on 2026-11-14 and re-read in full on 2026-11-24: 4 pages, 3 footnotes, signed by Daniel
    Brillman, Deputy Administrator and Director. Offers every state an optional hold harmless period through June
    30, 2027. A state that elects it may suspend denials of eligibility and disenrollments when an applicable individual
    does not demonstrate compliance with community engagement. This covers applications received and renewals initiated
    through and including June 30, 2027. A state may implement a shorter period. A state may use the period only
    if it assesses whether each individual meets the requirement (including deemed compliance) or is excluded, for
    all relevant applications and renewals in the period. The period covers only conditioning eligibility on community
    engagement (section 1902(xx)(1) of the Act, 42 C.F.R. 435.559); it does not apply to any other part of implementing
    community engagement by Jan. 1, 2027, or to denials and disenrollments on other eligibility criteria, such as
    age or household income. A state requests the period in its mitigation plan and must have CMS approval before
    using it; a state that intends to use it from Jan. 1, 2027 is asked to notify CMS by Dec. 11, 2026. For applications
    submitted and renewals initiated after the period ends in a state, the state must deny or terminate eligibility
    for not meeting the requirement, after the noncompliance procedures at 42 C.F.R. 435.558. The letter does not
    name any state that has elected the period. Terms: the letter calls the requirement ''community engagement''
    and says CMS refers to Public Law No. 119-21 as the ''Working Families Tax Cut'' (WFTC) legislation. Footnote
    3 cites Massachusetts v. Oz as No. 26-12692-RGS; the order in this registry (MED-S28) carries No. 1:26-cv-12962.
    medicaid.gov answered 403 to a plain automated request on 2026-11-14; the PDF was fetched with a web fetch tool
    and its text extracted with pdftotext. The CMS press release of the same day is not registered: the letter is
    the primary source and no page links to the release.'
