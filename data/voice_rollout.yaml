# Four-beat rollout ledger for data/pages.yaml (docs/CONTENT-STYLE.md section 6).
#
# tests/test_page_fields.py requires, on every page except 404:
#   - answer and why (Beat 1), and
#   - a lead analogy, unless the page is listed under analogy_exempt.
# Pages listed under pending have not had their content pass yet. Remove a slug from pending in
# the same change that adds its fields; the test fails if a pending page is already complete, so
# this list only shrinks.

# Exempt from the analogy requirement (27 slugs, including '404'; leaves 41 of 67 non-404 pages).
analogy_exempt:
  # Front door, router, and site utility pages
  - index
  - start
  - sources
  - about
  - accessibility
  - privacy
  - '404'
  # Desk source registries
  - medicaid-sources
  - id-records-sources
  # Interactive tools (they carry the tool notice instead)
  - medicaid-oregon-check
  - medicaid-washington-check
  - medicaid-utah-check
  - id-records-path
  # Glossaries
  - medicaid-oregon-words
  - medicaid-washington-words
  - medicaid-utah-words
  - id-records-glossary
  # Printable hours logs
  - medicaid-oregon-log
  - medicaid-washington-log
  - medicaid-utah-log
  # Help directories
  - medicaid-oregon-help
  - medicaid-washington-help
  - medicaid-utah-help
  - id-records-help
  # Immigration pages: an analogy there can read as advice about someone's status
  - medicaid-oregon-immigration
  - medicaid-washington-immigration
  - medicaid-utah-immigration

# 67 pages (every page except 404), in data/pages.yaml order.
# All 67 non-404 pages now carry their four-beat fields.
pending: []
