  - MED-S42
  show_short_toggle: true
  answer: An OHP Request for Information gives 35 calendar days to send only the missing proof or report an exemption,
    while informational and status notices do not end coverage today.
  why: Spotting the exact letter type and answering before the 35-day cutoff—online, by phone, in person, by fax,
    or by mail—prevents an avoidable closure.
  spec:
    clock: or_rfi_reply_clock
    paperwork: MED-S19
    catch:
      text: A Notice of Status alerts members that work-rule status changed without ending current benefits, whereas
        a Request for Information starts a 35-day reply clock.
      basis:
      - MED-S04
  analogies:
  - id: four-different-envelopes-one-clock
    placement: lead
    compare: 'Treat OHP mail like sorting four different utility notices on a kitchen table: a December newsletter,
      an eligibility statement, a heads-up status alert, and a 35-day shutoff-prevention request. Only the Request
      for Information is asking to fill a specific missing blank from OHP''s database check, and it accepts replies
      across five channels.'
    boundary: Even after a missed 35-day reply date leads to a denial or closure, Oregon imposes no waiting period
      to reapply in any month or request a hearing.
    basis:
    - MED-S04
    - MED-S06
    - MED-S08
