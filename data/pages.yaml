  analogies:
  - id: two-locks-one-envelope
    placement: lead
    compare: 'Washington''s birth-record archive puts two different locks on the same certificate: the sex-designation
      lock opens only with notarized state form DOH 422-143 (a judge''s order does not fit that keyhole), while
      the legal-name lock opens only with a certified court order plus form DOH 422-126. Both forms can travel
      in one envelope so the archive updates both fields in a single 4-to-6-week pass.'
