- slug: medicaid
  art: print-homes.webp
  route: /medicaid/
  desk: medicaid
  template: medicaid/index.html
  title: 2027 Medicaid work and activity rules
  nav_label: Medicaid overview
  description: Plain-language guides and 1-minute checks for the 2027 Medicaid work and activity rules in Oregon
    (OHP), Washington (Apple Health), and Utah Medicaid.
  checked: '2026-11-24'
  show_short_toggle: false
  answer: Starting Jan. 1, 2027, federal law adds work or activity rules, shorter past-bill coverage, and 6-month
    renewals for many Medicaid expansion adults ages 19 to 64, though states control how strict enforcement is.
  why: Oregon and Washington paused work-rule denials through June 30, 2027, while Utah has not announced a pause,
    so the same federal law produces very different deadlines depending on your state.
  analogies:
  - id: federal-floor-state-gates
    placement: lead
    compare: 'Think of Congress writing one national store-coupon rule—earn $580 or log 80 hours—while letting each state wire up its own checkout register. One state''s scanner clears regulars silently from state files, two states wave penalties through June 2027 while testing their registers, and the third checks receipts at the door starting New Year''s Day.'
    boundary: 'Unlike a store manager who can postpone every corporate policy at once, no state can pause Congress''s Jan. 1, 2027 switch to 6-month renewals and a 1-month cap on unpaid past medical bills.'
    basis:
    - MED-S27
    - MED-S41
    - MED-S53
    - MED-WA27
    - MED-U02
