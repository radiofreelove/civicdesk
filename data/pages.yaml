  show_short_toggle: true
  answer: Oregon Health Plan (OHP) starts checking 2027 work or activity rules for adults ages 19 to 64 on Jan.
    1, 2027, while pausing denials solely for work rules through June 30, 2027.
  why: OHP still runs automatic record checks starting Jan. 1, 2027, standard income rules still apply, and past-medical-bill
    coverage shrinks from 3 months to 1 month for most adults on Jan. 1, 2027.
  spec:
    clock: or_hold_harmless_clock
    catch:
      text: Oregon's hold-harmless pause blocks work-rule denials through June 30, 2027, but does not pause income
        rules or the shorter 1-month past-bill window.
      basis:
      - MED-S01
      - MED-S07
      - MED-S53
      - MED-S41
  analogies:
  - id: soft-launch-inspection-period
    placement: lead
    compare: 'Oregon''s rollout works like a town turning on new speed cameras for a six-month test run where the flash still fires and drivers still get a photo in the mail—stamped as a $0 warning instead of a ticket. Starting Jan. 1, 2027, OHP''s computers check payroll and school records and mail status notices without closing coverage solely over work rules through June 30, 2027.'
    boundary: 'Unlike a guaranteed local grace period, Oregon''s six-month pause still awaits federal sign-off—and ignoring regular OHP renewal mail can still close coverage before July.'
    basis:
    - MED-S07
    - MED-S53
    - MED-S41
    - MED-S04
