  - MED-S44
  - MED-S45
  - MED-S46
  show_short_toggle: true
  answer: Oregon Health Plan (OHP) starts checking 2027 work or activity rules for adults ages 19 to 64 on Jan.
    1, 2027, while pausing denials solely for work rules through June 30, 2027.
  why: OHP still runs automatic record checks starting Jan. 1, 2027, standard income rules still apply, and past-medical-bill
    coverage shrinks from 3 months to 1 month for most adults on Jan. 1, 2027.
  spec:
    clock: or_hold_harmless_clock
    catch:
      text: Oregon's hold-harmless pause blocks work-rule denials through June 30, 2027, but does not pause income
        rules or the shorter 1-month past-bill window.
      basis:
      - MED-S01
      - MED-S07
      - MED-S53
      - MED-S41
  analogies:
  - id: soft-launch-inspection-period
    placement: lead
    compare: Oregon's hold-harmless period works like a city testing new parking meters for six months with warning
      tickets instead of towing. Starting Jan. 1, 2027, OHP's computers still check payroll and school databases
      and mail status letters, but Oregon directed the agency not to deny or close coverage solely over work rules
      through June 30, 2027.
    boundary: The hold-harmless delay is subject to federal approval and never protects an application that misses
      standard OHP income, residency, or renewal rules.
    basis:
    - MED-S07
    - MED-S53
    - MED-S41
    - MED-S04
