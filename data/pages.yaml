  - id: four-different-envelopes-one-clock
    placement: lead
    compare: 'Four envelopes from the same agency feel less stressful once you read them like car dashboard lights: three are passive readouts—like trip mileage or a seasonal tire reminder—and only one is the blinking oil light asking you to top off within 35 days. OHP''s general mailers and status alerts ask for nothing today, while only a Request for Information needs the missing detail or exemption reported across five reply options.'
    boundary: 'Unlike an engine that locks up for good when a warning runs out, missing Oregon''s 35-day reply date creates zero lockout penalty—anyone can file a fresh OHP application the very next month or ask for a hearing.'
    basis:
    - MED-S04
    - MED-S06
