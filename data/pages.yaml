    placement: lead
    compare: 'Applying for OHP works like a tax return that prefills W-2s before asking for receipts: once an
      application is submitted, OHP''s system queries state payroll, school, and benefit databases behind the
      scenes. It sends a proof letter only for the specific blanks those electronic feeds could not confirm.'
    boundary: OHP Bridge covers adults slightly above standard OHP income limits with $0 premiums, so being over
      standard OHP income does not automatically close public coverage options.
    basis:
    - MED-S04
    - MED-S09
    - MED-S13
