- slug: medicaid-oregon-rules
  art: print-calendar.webp
  route: /medicaid/oregon/rules/
  desk: medicaid
  state: oregon
  template: medicaid/oregon/rules.html
  title: The new rules, in plain words
  nav_label: The new rules
  description: Who the new OHP work or activity rules are for, the 3 ways to meet them, and what counts as work,
    school, and volunteering.
  checked: '2026-11-24'
  sources:
  - MED-S01
  - MED-S02
  - MED-S03
  - MED-S04
  - MED-S05
  - MED-S06
  - MED-S07
  - MED-S53
  - MED-S08
  - MED-S23
  - MED-S27
  - MED-S41
  - MED-S44
  - MED-S45
  - MED-S46
  - MED-S47
  show_short_toggle: true
  answer: Starting Jan. 1, 2027, covered OHP adults ages 19 to 64 meet the rule in any one of 3 ways—$580+ monthly
    household income, half-time school, or 80 combined activity hours—checked automatically first for the prior
    month.
  why: There are no monthly reports to file and no requirement to earn all 80 hours in a single job, because OHP
    checks databases first and lets work, school, training, and nonprofit volunteering add up.
  spec:
    clock: or_hold_harmless_clock
    catch:
      text: Oregon checks the month before applying and renewals due March 31, 2027 or later, with zero monthly
        reporting in between.
      basis:
      - MED-S01
      - MED-S04
      - MED-S47
  analogies:
  - id: three-pass-turnstile-bucket
    placement: lead
    compare: Think of OHP's activity test like a subway station with three turnstiles—household income of $580+,
      half-time school, or an 80-hour bucket—and only one gate needs to click open. The 80-hour bucket lets paid
      shifts, gig work, classes, job training, and tracked nonprofit volunteering pour in together until the bucket
      reaches 80 hours for that prior month.
    boundary: OHP counts combined Medicaid household income toward the $580 bar (so two adults do not each need
      $580), whereas the 80-hour bar is checked separately for each covered adult.
    basis:
    - MED-S01
    - MED-S27
    - MED-S04
