- slug: medicaid-oregon-rules
  art: print-calendar.webp
  route: /medicaid/oregon/rules/
  desk: medicaid
  state: oregon
  template: medicaid/oregon/rules.html
  title: The new rules, in plain words
  nav_label: The new rules
  description: Who the new OHP work or activity rules are for, the 3 ways to meet them, and what counts as work,
    school, and volunteering.
  checked: '2026-11-24'
  sources:
  - MED-S01
  - MED-S02
  - MED-S03
  - MED-S04
  - MED-S05
  - MED-S06
  - MED-S07
  - MED-S53
  - MED-S08
  - MED-S23
  - MED-S27
  - MED-S41
  - MED-S44
  - MED-S45
  - MED-S46
  - MED-S47
  show_short_toggle: true
  answer: Starting Jan. 1, 2027, covered OHP adults ages 19 to 64 meet the rule in any one of 3 ways—$580+ monthly
    household income, half-time school, or 80 combined activity hours—checked automatically first for the prior
    month.
  why: There are no monthly reports to file and no requirement to earn all 80 hours in a single job, because OHP
    checks databases first and lets work, school, training, and nonprofit volunteering add up.
  spec:
    clock: or_hold_harmless_clock
    catch:
      text: Oregon checks the month before applying and renewals due March 31, 2027 or later, with zero monthly
        reporting in between.
      basis:
      - MED-S01
      - MED-S04
      - MED-S47
  analogies:
  - id: three-pass-turnstile-bucket
    placement: lead
    compare: 'Picture a parking lot with three ways to validate your ticket: spend one flat amount at the grocery store, scan a student pass, or combine smaller stamps from different shops on the block until they reach 80 points. OHP opens the gate as soon as any single option clears—$580 in household pay, half-time school, or 80 combined hours across paid work, gig shifts, job training, classes, and nonprofit volunteering.'
    boundary: Unlike paid work or classes where payroll and school records exist, volunteer hours count toward the 80-hour mix only when tracked through a nonprofit or public program rather than informal help for friends or neighbors.
    basis:
    - MED-S01
    - MED-S27
    - MED-S04
  - id: household-income-vs-individual-hours
    placement: inline
    compare: 'Splitting household rent works differently than clocking in at work: one roommate''s $580 paycheck can cover the rent check for the whole apartment, yet clocking extra overtime at your job never puts hours onto your roommate''s timecard. Federal rules pool household income the first way and count the 80-hour rule the second way.'
    boundary: Unlike shared rent where everyone on the lease owes a share, household members outside ages 19 to 64 or covered by an exemption skip both checks.
    basis:
    - MED-S27
    - MED-S05
    - MED-S01
