- slug: medicaid-oregon-bills
  art: print-mail.webp
  route: /medicaid/oregon/bills/
  desk: medicaid
  state: oregon
  template: medicaid/oregon/bills.html
  title: Medical bills from before you apply
  nav_label: Past medical bills
  description: OHP can help with some medical bills from before you apply. Starting Jan. 1, 2027, that window
    gets shorter for most adults.
  checked: '2026-11-24'
  sources:
  - MED-S01
  show_short_toggle: true
  answer: OHP retroactive coverage pays eligible unpaid bills from up to 3 months before applying through Dec.
    31, 2026, then shrinks on Jan. 1, 2027 to 1 month for most adults ages 19 to 64 (2 months for children, seniors,
    pregnancy, and disability).
  why: Waiting past Dec. 31, 2026—or delaying an application after an ER visit in 2027—can leave 2 months of past
    hospital bills outside OHP's reach.
  spec:
    clock: or_retro_2027_clock
    catch:
      text: The 1-month retroactive limit starts Jan. 1, 2027 even during Oregon's hold-harmless pause on work-rule
        denials.
      basis:
      - MED-S01
  analogies:
  - id: shrinking-rearview-mirror
    placement: lead
    compare: 'Think of a work-wear store that honors a discount on boots you bought earlier in the fall—as long as you qualified on the day on the receipt—until New Year''s Day, when the store trims that receipt window from 90 days down to 30. OHP''s retroactive coverage reaches back from your application month to pay eligible unpaid medical bills, and on Jan. 1, 2027 that reach-back drops from three months to one month for most adults ages 19 to 64.'
    boundary: Unlike a flat storewide cut, children 18 or younger, adults 65 and older, pregnant members, and disability-based OHP groups keep a 2-month lookback window starting Jan. 1, 2027.
    basis:
    - MED-S01
