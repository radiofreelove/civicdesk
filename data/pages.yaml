  answer: People born in Washington change their birth-record sex designation (M, F, or X) for $0 amendment fee
    using notarized form DOH 422-143, and change their legal name with a certified court order plus form DOH 422-126.
  why: Mailing a court order alone will not change a Washington birth-record sex designation, and Washington DOH
    retired its old correction form (DOH 422-034) on Nov. 4, 2026.
  spec:
    cost: wa_doh_amend_fee
    clock: wa_doh_mail_clock
    paperwork: ID-WA-DOH-422-143
    catch:
      text: Washington DOH rejects court orders and doctor letters for the sex designation; only notarized form
        DOH 422-143 (or 422-144 for minors) works.
