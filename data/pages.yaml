      own files already flag age, Medicare, SNAP or TANF work compliance, or disaster counties, and a raise-your-hand
      lane for caregiving, Tribal status, hospital stays, or health conditions that no state wage database knows
      about.'
    boundary: Being excused from SNAP work rules does not carry over automatically to OHP—only actively meeting
      SNAP or TANF work requirements counts in the automatic lane.
    basis:
    - MED-S02
    - MED-S03
