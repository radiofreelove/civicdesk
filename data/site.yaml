# Site-wide settings for CivicDesk (civicdesk.net).
name: CivicDesk
tagline: "Plain-language guides to government rules, benefits, and official records"
version: "0.1.0"
last_checked: "2026-11-25"
public_url: "https://civicdesk.net/"
repo_url: "https://github.com/radiofreelove/civicdesk"
max_source_age_days: 120
quick_exit_url: "https://www.weather.gov/"
corrections_email: "corrections@civicdesk.net"
# Pre-filled body for every corrections mailto: link (scripts/build.py correction_mailto).
corrections_mailto_body: "Please describe the page problem only. Do not include names, case numbers, health details, or other personal information. CivicDesk cannot answer questions about individual situations."
dateline_places: "Oregon · Washington · Utah · Federal"

# Jurisdiction options for /start/ Question 1.
router_states:
  - {slug: oregon, label: "Oregon"}
  - {slug: washington, label: "Washington"}
  - {slug: utah, label: "Utah"}
  - {slug: federal, label: "Another U.S. state or federal agency only"}

# Desk registry: single source of truth for active and upcoming service desks.
# Drives front-page desk tiles, upcoming-desk briefs, header taglines, guide switcher menus,
# primary navigation, footer links, datelines, quick-exit scoping, /start/ routing, /sources/,
# /about/, /404.html, and per-desk source registry pages.
# A new active desk also needs a body.desk-<slug> block and per-theme tokens in static/css/site.css.
desks:
  - slug: medicaid
    status: active
    name: "Health coverage"
    full_title: "2027 Medicaid work and activity rules"
    kicker: "Medicaid"
    tagline: "2027 Medicaid work and activity rules"
    nav_label: "2027 Medicaid"
    footer_label: "2027 Medicaid desk"
    blurb: "New work and activity rules start Jan. 1, 2027. Exemptions, deadlines, and a 1-minute check."
