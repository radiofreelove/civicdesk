# Site-wide settings for CivicDesk (civicdesk.net).
name: CivicDesk
tagline: "Plain-language guides to government rules, benefits, and official records"
version: "0.1.0"
last_checked: "2026-11-25"
public_url: "https://civicdesk.net/"
repo_url: "https://github.com/radiofreelove/civicdesk"
max_source_age_days: 120
quick_exit_url: "https://www.weather.gov/"
corrections_email: "corrections@civicdesk.net"

# Zero-code drop-in artist logo configuration (see docs/DESIGN.md Section 6).
# Defaults keep CivicDesk's programmatic 5-stripe mark and HTML wordmark unchanged.
brand:
  custom_artwork: false
  mode: "mark_and_wordmark"
  logo: ""
  logo_dark: ""
  favicon_svg: "favicon.svg"
  apple_touch_icon: "apple-touch-icon.png"
  og_image: "og-card.png"
  og_image_alt: "CivicDesk five-stripe service-desk mark on press ink"
