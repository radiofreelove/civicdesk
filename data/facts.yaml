wa_hold_harmless_clock:
  value: Work-rule denials paused through June 30, 2027; 6-month renewals begin Jan. 1, 2027
  sources:
  - MED-WA22
  - MED-WA27
  - MED-S41
  note: Washington HCA hold-harmless enforcement delay pursued through June 30, 2027 (pending federal approval).
ut_six_month_clock:
  value: Applicant checks begin Jan. 1, 2027; renewals shift to every 6 months
  sources:
  - MED-U01
  - MED-U02
  - MED-U13
  note: Utah community-engagement start date and 6-month renewal schedule for Adult Expansion and Targeted Adult Medicaid.

