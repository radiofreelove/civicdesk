or_retro_2027_clock:
  value: 1 month before applying for most adults ages 19 to 64 starting Jan. 1, 2027
  sources:
  - MED-S01
  note: OHP retroactive coverage window changes from 3 months through Dec. 31, 2026 to 1 month for most expansion adults.
wa_retro_2027_clock:
  value: 1 month before applying for Apple Health for Adults starting Jan. 1, 2027
  sources:
  - MED-WA01
  - MED-WA03
  note: Apple Health for Adults retroactive window changes from 3 months through Dec. 31, 2026 to 1 month on Jan. 1, 2027.
ut_retro_2027_clock:
  value: 1 month before applying for Adult Expansion starting Jan. 1, 2027
  sources:
  - MED-U02
