name: Weekly Source Verification

# Runs Mondays for source link, freshness, registry, and build verification.

on:
  schedule:
    - cron: "17 16 * * 1" # Mondays, 16:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-source-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Weekly link, registry, and build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/build.py
      - run: python3 scripts/check_brand_purge.py

      - name: Check source freshness and links
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/verify_sources.py 2>&1 | tee verify-report.txt

      - name: Open or update issue if verification needs human review
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          raw = Path("verify-report.txt").read_text(encoding="utf-8", errors="replace")
          limit = 50000
          clipped = raw[:limit]
          suffix = "\n... [truncated]" if len(raw) > limit else ""
          body = (
              "The Monday weekly source verification flagged items for human review.\n\n"
              f"```\n{clipped}{suffix}\n```\n"
          )
          Path("body.md").write_text(body, encoding="utf-8")
          PY
          gh label create "automated-source-check" \
            --description "Opened by the weekly source verification workflow" \
            --color "0088B0" 2>/dev/null || true
          today_utc="$(date -u +%Y-%m-%d)"
          existing="$(gh issue list --state open --label "automated-source-check" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "Weekly source check needs attention ($today_utc)"
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create \
              --title "Weekly source check needs attention ($today_utc)" \
              --label "automated-source-check" \
              --body-file body.md
          fi
