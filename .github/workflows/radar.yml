name: Policy Radar

# Twice-weekly CivicDesk Policy Wire (Tuesdays and Fridays, 16:23 UTC) plus
# on-demand manual runs. Dynamically discovers enabled desks from `data/wire/*.yaml`
# so new desks added to CivicDesk enter rotation without workflow edits.
# Read-only against repository contents: maintains per-desk `wire:state` ledger,
# `wire:health` diagnostics, and `policy-radar` dispatch issues only.

on:
  schedule:
    - cron: "23 16 * * 2,5" # Tuesdays and Fridays, 16:23 UTC
  workflow_dispatch:
    inputs:
      desk:
        description: "Desk slug from data/wire/*.yaml, or 'all' for every enabled desk"
        required: false
        default: "all"
        type: string
      lookback_days:
        description: "Default days to look back when no prior channel cursor exists (1 to 60)"
        required: false
        default: "7"
        type: string
      dry_run:
        description: "Preview wire report in Job Summary without updating state, health, or dispatch issues"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: policy-radar
  cancel-in-progress: false

jobs:
  discover:
    name: Discover active wire desks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      desks: ${{ steps.desks.outputs.desks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Resolve target desk matrix from data/wire/*.yaml
        id: desks
        env:
          DESK_INPUT: ${{ inputs.desk }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "scripts")
          import policy_radar

          requested = (os.environ.get("DESK_INPUT") or "all").strip()
          active = policy_radar.list_active_desks(include_disabled=False)
          all_known = policy_radar.list_active_desks(include_disabled=True)
          if not requested or requested == "all":
              selected = active
          elif requested in all_known:
              selected = [requested]
          else:
              raise SystemExit(f"Unknown desk {requested!r}; known desks: {all_known}")
          print(f"desks={json.dumps(selected)}")
          PY

  radar:
    name: Policy Wire (${{ matrix.desk }})
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        desk: ${{ fromJson(needs.discover.outputs.desks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Fetch per-desk JSON state ledger and recent dispatch issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_LABEL: "radar:${{ matrix.desk }}"
        run: |
          gh issue list \
            --label "policy-radar" \
            --label "$DESK_LABEL" \
            --state all \
            --limit 25 \
            --json number,state,title,labels,body,comments > recent-radar-issues.json || echo "[]" > recent-radar-issues.json
          gh issue list \
            --label "wire:state" \
            --label "$DESK_LABEL" \
            --state all \
            --limit 1 \
            --json number,state,body > wire-state-issue.json || echo "[]" > wire-state-issue.json

      - name: Run CivicDesk Policy Wire sweep
        id: sweep
        env:
          DESK: ${{ matrix.desk }}
          LOOKBACK_RAW: ${{ inputs.lookback_days }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIRE_HEARTBEAT_URL: ${{ secrets.WIRE_HEARTBEAT_URL }}
        run: |
          days="${LOOKBACK_RAW:-7}"
          if ! [[ "$days" =~ ^[0-9]+$ ]]; then
            days="7"
          fi
          set +e
          python3 scripts/policy_radar.py \
            --desk "$DESK" \
            --days "$days" \
            --ai-brief \
            --seen-issues recent-radar-issues.json \
            --state-in wire-state-issue.json \
            --state-out wire-state-out.json \
            --state-issue-body wire-state-body.md \
            --report radar-report.md \
            --results radar-results.json
          rc=$?
          set -e
          echo "radar_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f radar-results.json ]; then
            jq -r '.statuses[] | "  \(.source): \(.status)"' radar-results.json
          fi
          if [ -f radar-report.md ]; then
            cat radar-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist per-desk wire:state ledger issue
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK: ${{ matrix.desk }}
          DESK_LABEL: "radar:${{ matrix.desk }}"
        run: |
          if [ ! -f wire-state-body.md ]; then
            echo "No state body produced; skipping state ledger update."
            exit 0
          fi
          all_failed="$(jq -r '.all_channels_failed // false' radar-results.json 2>/dev/null || echo 'false')"
          if [ "$all_failed" = "true" ]; then
            echo "All channels failed; preserving prior wire:state cursor."
            exit 0
          fi
          gh label create "wire:state" \
            --description "Automated Policy Wire JSON state, cursor, and fingerprint ledger" \
            --color "57534E" 2>/dev/null || true
          gh label create "$DESK_LABEL" \
            --description "CivicDesk Policy Wire dispatches for the $DESK desk" \
            --color "D6006C" 2>/dev/null || true
          state_num="$(jq -r '.[0].number // empty' wire-state-issue.json)"
          if [ -n "$state_num" ]; then
            gh issue edit "$state_num" --body-file wire-state-body.md
          else
            created_url="$(gh issue create \
              --title "CivicDesk Wire State ($DESK) — automated ledger" \
              --label "wire:state" \
              --label "$DESK_LABEL" \
              --body-file wire-state-body.md)"
            gh issue close "$created_url" --reason "completed" || true
          fi

      - name: Open, update, or resolve wire:health issue on channel errors or empty streaks
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK: ${{ matrix.desk }}
          DESK_LABEL: "radar:${{ matrix.desk }}"
        run: |
          if [ ! -f radar-results.json ]; then
            exit 0
          fi
          alert_count="$(jq -r '(.health_alerts // []) | length' radar-results.json)"
          existing_health="$(gh issue list --state open --label "wire:health" --label "$DESK_LABEL" --limit 1 --json number --jq '.[0].number // empty')"
          today="$(date -u +%Y-%m-%d)"
          if [ "$alert_count" -gt 0 ]; then
            gh label create "wire:health" \
              --description "Policy Wire channel error, key expiration, or silent empty-streak alert" \
              --color "B45309" 2>/dev/null || true
            gh label create "$DESK_LABEL" \
              --description "CivicDesk Policy Wire dispatches for the $DESK desk" \
              --color "D6006C" 2>/dev/null || true
            python3 - <<'PY'
            import json
            from pathlib import Path

            res = json.loads(Path("radar-results.json").read_text(encoding="utf-8"))
            lines = [
                f"## CivicDesk Wire Health Alert — `{res['desk']}` ({res['desk_label']})",
                "",
                f"Sweep on `{res['today']}` flagged **{len(res.get('health_alerts', []))}** channel health issue(s):",
                "",
            ]
            for alert in res.get("health_alerts", []):
                lines.append(f"- {alert}")
            lines.extend(["", "### Channel telemetry", "", "| Channel | Status |", "|---|---|"])
            for st in res.get("statuses", []):
                src = str(st["source"]).replace("|", "/")
                val = str(st["status"]).replace("|", "/").replace("\n", " ")
                lines.append(f"| `{src}` | {val} |")
            lines.append("")
            Path("wire-health-body.md").write_text("\n".join(lines), encoding="utf-8")
            PY
            if [ -n "$existing_health" ]; then
              gh issue edit "$existing_health" --title "CivicDesk Wire Health ($DESK): $alert_count channel alert(s) ($today)"
              gh issue comment "$existing_health" --body-file wire-health-body.md
            else
              gh issue create \
                --title "CivicDesk Wire Health ($DESK): $alert_count channel alert(s) ($today)" \
                --label "wire:health" \
                --label "$DESK_LABEL" \
                --body-file wire-health-body.md
            fi
          elif [ -n "$existing_health" ]; then
            gh issue comment "$existing_health" --body "All configured channels for \`$DESK\` completed without health alerts on \`$today\`. Closing resolved \`wire:health\` issue."
            gh issue close "$existing_health" --reason "completed"
          fi

      - name: Open or update desk policy-radar issue when unseen dispatches arrive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK: ${{ matrix.desk }}
          DESK_LABEL: "radar:${{ matrix.desk }}"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ ! -f radar-results.json ]; then
            exit 0
          fi
          new_count="$(jq -r '.new_count // 0' radar-results.json)"
          urgent_count="$(jq -r '.urgent_count // 0' radar-results.json)"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled ($new_count unseen dispatch(es), $urgent_count urgent); skipping GitHub issue update."
            exit 0
          fi
          if [ "$new_count" -le 0 ]; then
            echo "No new unseen policy-wire dispatches for $DESK."
            exit 0
          fi
          gh label create "policy-radar" \
            --description "Opened or updated by the scheduled CivicDesk Policy Wire workflow" \
            --color "0088B0" 2>/dev/null || true
          gh label create "$DESK_LABEL" \
            --description "CivicDesk Policy Wire dispatches for the $DESK desk" \
            --color "D6006C" 2>/dev/null || true
          if [ "$urgent_count" -gt 0 ]; then
            gh label create "wire:urgent" \
              --description "Contains direct registry changes, near-term final rules, or court orders/opinions" \
              --color "111827" 2>/dev/null || true
          fi
          today="$(date -u +%Y-%m-%d)"
          open_num="$(jq -r '[.[] | select(.state == "OPEN" and (([.labels[]?.name] | index("wire:health")) == null) and (([.labels[]?.name] | index("wire:state")) == null))][0].number // empty' recent-radar-issues.json)"
          if [ -n "$open_num" ]; then
            gh issue comment "$open_num" --body-file radar-report.md
            if [ "$urgent_count" -gt 0 ]; then
              gh issue edit "$open_num" \
                --add-label "wire:urgent" \
                --title "CivicDesk Wire ($DESK): dispatches to review, $urgent_count urgent (updated $today)"
            else
              gh issue edit "$open_num" \
                --title "CivicDesk Wire ($DESK): dispatches to review (updated $today)"
            fi
          else
            if [ "$urgent_count" -gt 0 ]; then
              gh issue create \
                --title "CivicDesk Wire ($DESK): $new_count dispatch(es) to review, $urgent_count urgent ($today)" \
                --label "policy-radar" \
                --label "$DESK_LABEL" \
                --label "wire:urgent" \
                --body-file radar-report.md
            else
              gh issue create \
                --title "CivicDesk Wire ($DESK): $new_count dispatch(es) to review ($today)" \
                --label "policy-radar" \
                --label "$DESK_LABEL" \
                --body-file radar-report.md
            fi
          fi

      - name: Fail job when every active wire channel failed
        env:
          RADAR_RC: ${{ steps.sweep.outputs.radar_rc }}
        run: |
          if [ "${RADAR_RC:-0}" -ne 0 ]; then
            echo "Every active Policy Wire channel failed (exit code $RADAR_RC)." >&2
            exit "$RADAR_RC"
          fi
